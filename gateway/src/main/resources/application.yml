spring:
  main:
    banner-mode: "off"
  output:
    ansi:
      enabled: never
server:
  port: 8080
fleet:
  kafka: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  registry: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,dependencies
logging:
  structured:
    format:
      console: com.ingen.fleet.FleetJsonFormatter
