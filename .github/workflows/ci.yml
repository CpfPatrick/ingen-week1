name: Week-2 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - run: gradle --no-daemon build
      - name: Build pinned MinIO server for real-container tests
        run: docker build -f deploy/Dockerfile.minio -t ingen-minio:week2 .
      - name: Test real ingestion services and report coverage
        run: gradle --no-daemon :gateway:integrationTest :gateway:jacocoTestReport
      - name: Build the deployable gateway image
        run: docker build -f deploy/Dockerfile.gateway -t ingen-gateway:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-test-evidence
          path: |
            gateway/build/test-results/
            gateway/build/reports/tests/
            gateway/build/reports/jacoco/
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          python-version: '3.11'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy inference-worker tests scripts
      - run: uv run pytest
